<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Superr Taco - Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1a12; color: #fff; padding: 40px 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(46, 204, 113, 0.3); padding-bottom: 20px; }
    .header h1 { color: #2ecc71; font-size: 28px; }
    
    .stats-container { display: flex; gap: 20px; margin-bottom: 30px; }
    .stat-box { flex: 1; background: rgba(15, 38, 26, 0.9); border: 1px solid rgba(46, 204, 113, 0.3); padding: 20px; border-radius: 16px; text-align: center; }
    .stat-box h3 { color: #b2dfdb; font-size: 14px; margin-bottom: 10px; }
    .stat-box p { color: #2ecc71; font-size: 32px; font-weight: bold; }

    .table-container { background: rgba(15, 38, 26, 0.9); border: 1px solid rgba(46, 204, 113, 0.3); border-radius: 16px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 15px 20px; border-bottom: 1px solid rgba(46, 204, 113, 0.1); }
    th { background-color: rgba(46, 204, 113, 0.1); color: #2ecc71; font-weight: 600; }
    td { color: #e0e0e0; font-size: 14px; }
    .stars { color: #f1c40f; letter-spacing: 2px; }
    .empty-state { text-align: center; padding: 30px; color: #b2dfdb; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🌮 Superr Taco | Yönetim Paneli</h1>
    </div>

    <div class="stats-container">
      <div class="stat-box">
        <h3>Toplam Düşük Puanlı Geri Bildirim</h3>
        <p id="total-reviews">0</p>
      </div>
    </div>

    <div class="table-container">
      <table id="reviews-table">
        <thead>
          <tr>
            <th>Tarih</th>
            <th>Puan</th>
            <th>Müşteri Yorumu / Şikayeti</th>
          </tr>
        </thead>
        <tbody id="reviews-body">
          <!-- Yorumlar buraya JS ile eklenecek -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Test amaçlı LocalStorage'dan verileri çekiyoruz.
    // Gerçek sistemde burası Firebase veya veritabanından veri çekecek.
    function loadReviews() {
      const reviews = JSON.parse(localStorage.getItem('superrTacoReviews')) || [];
      const tbody = document.getElementById('reviews-body');
      
      document.getElementById('total-reviews').innerText = reviews.length;

      if(reviews.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="empty-state">Henüz geri bildirim bulunmuyor.</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      reviews.reverse().forEach(review => {
        let starString = '⭐'.repeat(review.puan);
        let dateString = new Date(review.tarih).toLocaleString('tr-TR');
        
        tbody.innerHTML += `
          <tr>
            <td>${dateString}</td>
            <td class="stars">${starString}</td>
            <td>${review.yorum || '<em style="color:#888;">Yorum bırakılmadı</em>'}</td>
          </tr>
        `;
      });
    }

    loadReviews();
  </script>
</body>
</html>
