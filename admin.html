<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Superr Taco - Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1a12; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    /* Şifre Ekranı Tasarımı */
    #login-screen {
      background: rgba(15, 38, 26, 0.9); border: 1px solid rgba(46, 204, 113, 0.3);
      padding: 40px; border-radius: 16px; text-align: center; width: 100%; max-width: 400px;
    }
    #login-screen h2 { color: #2ecc71; margin-bottom: 20px; }
    #login-screen input {
      width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 8px;
      border: 1px solid #2ecc71; background: #0b1a12; color: #fff; font-size: 16px; outline: none;
    }
    #login-screen button {
      width: 100%; padding: 15px; background: #2ecc71; color: #0b1a12; border: none;
      border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
    }

    /* Admin Panel Tasarımı (Başlangıçta Gizli) */
    #admin-dashboard { display: none; width: 100%; max-width: 900px; align-self: flex-start; margin: 0 auto; margin-top: 20px;}
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(46, 204, 113, 0.3); padding-bottom: 20px; }
    .header h1 { color: #2ecc71; font-size: 28px; }
    .stats-container { display: flex; gap: 20px; margin-bottom: 30px; }
    .stat-box { flex: 1; background: rgba(15, 38, 26, 0.9); border: 1px solid rgba(46, 204, 113, 0.3); padding: 20px; border-radius: 16px; text-align: center; }
    .stat-box h3 { color: #b2dfdb; font-size: 14px; margin-bottom: 10px; }
    .stat-box p { color: #2ecc71; font-size: 32px; font-weight: bold; }
    .table-container { background: rgba(15, 38, 26, 0.9); border: 1px solid rgba(46, 204, 113, 0.3); border-radius: 16px; overflow: hidden; width: 100%;}
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 15px 20px; border-bottom: 1px solid rgba(46, 204, 113, 0.1); }
    th { background-color: rgba(46, 204, 113, 0.1); color: #2ecc71; font-weight: 600; }
    td { color: #e0e0e0; font-size: 14px; }
    .stars { color: #f1c40f; letter-spacing: 2px; }
    .empty-state { text-align: center; padding: 30px; color: #b2dfdb; }
  </style>
</head>
<body>

  <!-- ŞİFRE GİRİŞ EKRANI -->
  <div id="login-screen">
    <h2>Yönetim Paneli Girişi</h2>
    <input type="password" id="adminPassword" placeholder="Şifrenizi girin..." onkeypress="handleKeyPress(event)">
    <button onclick="checkPassword()">Giriş Yap</button>
    <p id="error-msg" style="color: #ff6b6b; margin-top: 15px; display: none; font-size: 14px;">Hatalı şifre, tekrar deneyin.</p>
  </div>

  <!-- GERÇEK YÖNETİM PANELİ (ŞİFRE DOĞRUYSA AÇILIR) -->
  <div id="admin-dashboard">
    <div class="header">
      <h1>🌮 Superr Taco | Yönetim Paneli</h1>
      <button onclick="logout()" style="padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 8px; cursor: pointer;">Çıkış Yap</button>
    </div>

    <div class="stats-container">
      <div class="stat-box">
        <h3>Toplam Düşük Puanlı Geri Bildirim</h3>
        <p id="total-reviews">0</p>
      </div>
    </div>

    <div class="table-container">
      <table id="reviews-table">
        <thead>
          <tr>
            <th>Tarih</th>
            <th>Puan</th>
            <th>Müşteri Yorumu / Şikayeti</th>
          </tr>
        </thead>
        <tbody id="reviews-body">
          <!-- Yorumlar buraya JS ile eklenecek -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // --- GÜVENLİK VE GİRİŞ İŞLEMLERİ ---
    
    // BURADAN ŞİFRENİZİ DEĞİŞTİREBİLİRSİNİZ
    const ADMIN_PASSWORD = "super2026"; 

    // Sayfa açıldığında daha önce giriş yapılmış mı diye kontrol et
    window.onload = function() {
      if(sessionStorage.getItem("isLoggedIn") === "true") {
        showDashboard();
      }
    };

    function handleKeyPress(e) {
      if (e.key === "Enter") checkPassword();
    }

    function checkPassword() {
      const input = document.getElementById("adminPassword").value;
      if (input === ADMIN_PASSWORD) {
        sessionStorage.setItem("isLoggedIn", "true");
        showDashboard();
      } else {
        document.getElementById("error-msg").style.display = "block";
      }
    }

    function showDashboard() {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("admin-dashboard").style.display = "block";
      // Sayfa ortalamasını iptal edip tepeye hizalamak için body stilini değiştir
      document.body.style.justifyContent = "flex-start"; 
      loadReviews();
    }

    function logout() {
      sessionStorage.removeItem("isLoggedIn");
      window.location.reload();
    }

    // --- VERİ ÇEKME İŞLEMLERİ (Şu anki LocalStorage Testi) ---
    function loadReviews() {
      const reviews = JSON.parse(localStorage.getItem('superrTacoReviews')) || [];
      const tbody = document.getElementById('reviews-body');
      
      document.getElementById('total-reviews').innerText = reviews.length;

      if(reviews.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="empty-state">Henüz geri bildirim bulunmuyor.</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      reviews.reverse().forEach(review => {
        let starString = '⭐'.repeat(review.puan);
        let dateString = new Date(review.tarih).toLocaleString('tr-TR');
        
        tbody.innerHTML += `
          <tr>
            <td>${dateString}</td>
            <td class="stars">${starString}</td>
            <td>${review.yorum || '<em style="color:#888;">Yorum bırakılmadı</em>'}</td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
