<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Superr Taco - Değerlendirme</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b1a12; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .rating-card { background: rgba(15, 38, 26, 0.9); border: 1px solid rgba(46, 204, 113, 0.3); padding: 35px 25px; border-radius: 24px; text-align: center; color: #fff; width: 100%; max-width: 420px; }
    .logo-container { margin-bottom: 15px; display: flex; justify-content: center; width: 100%; }
    .logo-circle { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #2ecc71; background-color: #fff; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .logo-circle img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
    .rating-card h2 { margin-bottom: 8px; font-size: 24px; color: #2ecc71; }
    .rating-card p { color: #b2dfdb; font-size: 14px; margin-bottom: 25px; }
    .stars-container { display: flex; justify-content: center; gap: 12px; cursor: pointer; margin-bottom: 20px; }
    .star { font-size: 38px; transition: transform 0.2s; user-select: none; }
    .star:hover { transform: scale(1.25); filter: drop-shadow(0 0 12px #2ecc71); }
    .feedback-box { display: none; margin-top: 20px; text-align: left; }
    .feedback-box textarea { width: 100%; height: 90px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(46, 204, 113, 0.4); border-radius: 12px; padding: 12px; color: #fff; font-size: 14px; margin-bottom: 10px; outline: none; }
    .feedback-box button { width: 100%; background-color: #2ecc71; color: #0b1a12; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
    .high-rating-box { display: none; margin-top: 20px; }
    .high-rating-box h3 { color: #2ecc71; margin-bottom: 15px; }
    .google-link-small { display: block; text-align: center; font-size: 10px; color: #666; text-decoration: none; opacity: 0.6; }
    .google-link-small:hover { text-decoration: underline; opacity: 1; }
    .google-link-large { display: inline-block; background-color: #4285F4; color: #fff; text-decoration: none; font-size: 22px; font-weight: bold; padding: 18px 30px; border-radius: 16px; width: 100%; box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4); margin-top: 10px; }
  </style>
</head>
<body>
  <div class="rating-card">
    <div class="logo-container">
      <div class="logo-circle">
        <img src="logo.png" alt="Superr Taco Logo">
      </div>
    </div>
    <h2>SUPERR TACO</h2>
    <p id="instruction-text">Deneyiminizi puanlayın, kendimizi geliştirmemize yardımcı olun!</p>
    
    <div class="stars-container" id="stars-block">
      <span class="star" onclick="rate(1)">⭐</span>
      <span class="star" onclick="rate(2)">⭐</span>
      <span class="star" onclick="rate(3)">⭐</span>
      <span class="star" onclick="rate(4)">⭐</span>
      <span class="star" onclick="rate(5)">⭐</span>
    </div>

    <div class="feedback-box" id="feedbackForm">
      <p style="font-size: 13px; margin-bottom: 8px; color: #ff6b6b;">Deneyiminizin tam beklendiği gibi olmamasına üzüldük. Bize önerilerinizi yazın:</p>
      <textarea id="userComment" placeholder="Görüş ve önerilerinizi buraya yazabilirsiniz..."></textarea>
      <button onclick="sendFeedback()">Görüşü Gönder</button>
      <a href="https://share.google/MH2bopcRsVNE7IFix" class="google-link-small" target="_blank">Google'da Değerlendir</a>
    </div>

    <div class="high-rating-box" id="highRatingForm">
      <h3>Desteğiniz için teşekkürler! 🌮</h3>
      <p style="font-size: 14px; color: #b2dfdb;">Bizi Google'da değerlendirerek herkese duyurun:</p>
      <a href="https://share.google/MH2bopcRsVNE7IFix" class="google-link-large" target="_blank">Google'da Değerlendir</a>
    </div>
  </div>

  <script>
    let selectedScore = 0;
    
    function rate(score) {
      selectedScore = score;
      document.getElementById('stars-block').style.display = 'none';
      document.getElementById('instruction-text').style.display = 'none';
      
      if (score <= 3) {
        document.getElementById('feedbackForm').style.display = 'block';
      } else {
        document.getElementById('highRatingForm').style.display = 'block';
      }
    }

    function sendFeedback() {
      const comment = document.getElementById('userComment').value;
      const submitBtn = document.querySelector('.feedback-box button');
      
      submitBtn.innerText = "Gönderiliyor...";
      submitBtn.disabled = true;

      // TEST AMAÇLI: Veriyi tarayıcı hafızasına (LocalStorage) kaydediyoruz.
      const newReview = { puan: selectedScore, yorum: comment, tarih: new Date().toISOString() };
      let existingReviews = JSON.parse(localStorage.getItem('superrTacoReviews')) || [];
      existingReviews.push(newReview);
      localStorage.setItem('superrTacoReviews', JSON.stringify(existingReviews));

      // İşlem başarılı efekti
      setTimeout(() => {
        submitBtn.innerText = "Teşekkürler!";
        submitBtn.style.backgroundColor = "#27ae60";
        document.getElementById('userComment').disabled = true;
      }, 500);
    }
  </script>
</body>
</html>
